name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply books-for-agents-db

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Reindex Vectorize embeddings
        run: |
          # The new version needs a moment to propagate; without a retry the
          # reindex can hit the previous one and fail an otherwise good deploy.
          for attempt in 1 2 3; do
            status=$(curl -s -o response.json -w '%{http_code}' \
              -X POST https://booksforagents.com/_admin/reindex \
              -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
              -H "Content-Type: application/json")
            echo "attempt $attempt: HTTP $status"
            cat response.json
            echo
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
